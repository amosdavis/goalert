name: Smoke

# Runs the smoke test suite against the Delta backend (in memory). The suite is
# the acceptance check for every phase of the filestore work: the same tests
# must keep passing (docs/filestore-failure-modes.md, F22).
on:
  push:
    branches: ['filestore-backend']

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install mailpit
        run: go tool gettool -t mailpit -v "$(cat mailpit.version)" -o bin/tools/mailpit
      - name: Smoke tests
        working-directory: test/smoke
        # -v lists every test's result, to compare against the baseline.
        run: go test -count=1 -parallel 10 -timeout 60m -v . | tee smoke.log; exit "${PIPESTATUS[0]}"
      - name: Summary
        if: always()
        working-directory: test/smoke
        run: |
          echo "passed: $(grep -c -E '^--- PASS' smoke.log)  failed: $(grep -c -E '^--- FAIL' smoke.log)"
          grep -E '^--- FAIL' smoke.log || true
